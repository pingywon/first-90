name = "first-90"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
routes = [{ pattern = "first90.meetdominic.me", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"

[[kv_namespaces]]
binding = "F90_KV"
id = "ceae812d07a742c2b49d8858fda1ae06"

[vars]
LIVE_AUDITS = "off"
PLANS_PER_VISITOR = "2"
PLANS_PER_DAY = "25"

# Secrets (wrangler secret put): ANTHROPIC_API_KEY, ANTHROPIC_WORKSPACE_ID, IP_SALT
